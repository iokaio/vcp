# SPDX-License-Identifier: Apache-2.0
# VCP modification: join the Codex workspace; preserve explicit upstream package/dependency settings.
[package]
workspace = "../../../../codex/codex-rs"
name = "munarium-core"
version = "1.2.1"
edition = "2021"
license = "Apache-2.0"
description = "The mesh kernel: append-only ledger semantics, supersession, deterministic gates, context composition. Pure: storage and retrieval live behind traits; no HTTP, no SQL, no provider calls."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
async-trait = "0.1"

# Boundary rule (architecture.md §3): this crate must never depend on
# sqlx, axum, tonic, reqwest, or utoipa. CI greps `cargo tree` for violations.
