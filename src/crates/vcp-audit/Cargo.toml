# SPDX-License-Identifier: Apache-2.0
[package]
name = "vcp-audit"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
workspace = "../../third_party/codex/codex-rs"

[features]
qualification = ["vcp-store/qualification"]

[[bin]]
name = "vcp-history-fixture"
path = "tests/fixtures/history_child.rs"
required-features = ["qualification"]

[dependencies]
vcp-domain = { path = "../vcp-domain" }
vcp-protocol = { path = "../vcp-protocol" }
vcp-store = { path = "../vcp-store" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
vcp-engine = { path = "../vcp-engine" }
vcp-budget = { path = "../vcp-budget" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
