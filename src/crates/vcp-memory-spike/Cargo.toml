[package]
name = "vcp-memory-spike"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
workspace = "../../third_party/codex/codex-rs"

[dependencies]
munarium-core = { path = "../../third_party/munarium/server/src/munarium-core" }
munarium-store-mem = { path = "../../third_party/munarium/server/src/munarium-store-mem" }
tokio = { version = "1", features = ["rt"] }
vcp-embedding = { path = "../vcp-embedding" }
munarium-datastore = { path = "../../third_party/munarium/server/src/munarium-datastore", features = ["vector-diskann"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
