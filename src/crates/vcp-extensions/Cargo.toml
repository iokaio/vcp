[package]
name = "vcp-extensions"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
workspace = "../../third_party/codex/codex-rs"

[dependencies]
vcp-domain = { path = "../vcp-domain" }
vcp-protocol = { path = "../vcp-protocol" }
vcp-repository = { path = "../vcp-repository" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
