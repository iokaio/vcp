# SPDX-License-Identifier: Apache-2.0
[package]
name = "vcp-embedding"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
workspace = "../../third_party/codex/codex-rs"

[dependencies]
candle-core = { version = "=0.11.0", default-features = false }
candle-nn = { version = "=0.11.0", default-features = false }
candle-transformers = { version = "=0.11.0", default-features = false }
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
