# SPDX-License-Identifier: Apache-2.0
[package]
name = "vcp-memory"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
workspace = "../../third_party/codex/codex-rs"

[dependencies]
vcp-embedding = { path = "../vcp-embedding" }
munarium-datastore = { path = "../../third_party/munarium/server/src/munarium-datastore", default-features = false, features = ["vector-diskann"] }
tantivy = { version = "0.22", default-features = false, features = ["mmap"] }
vcp-models = { path = "../vcp-models" }
munarium-core = { path = "../../third_party/munarium/server/src/munarium-core" }
vcp-domain = { path = "../vcp-domain" }
vcp-protocol = { path = "../vcp-protocol" }
vcp-store = { path = "../vcp-store" }
vcp-audit = { path = "../vcp-audit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
vcp-budget = { path = "../vcp-budget" }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
vcp-engine = { path = "../vcp-engine" }
