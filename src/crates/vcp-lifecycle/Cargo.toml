# SPDX-License-Identifier: Apache-2.0
[package]
name = "vcp-lifecycle"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
workspace = "../../third_party/codex/codex-rs"

[features]
qualification = ["vcp-store/qualification"]

[dependencies]
vcp-domain = { path = "../vcp-domain" }
vcp-protocol = { path = "../vcp-protocol" }
vcp-store = { path = "../vcp-store" }
vcp-engine = { path = "../vcp-engine" }
vcp-budget = { path = "../vcp-budget" }
vcp-audit = { path = "../vcp-audit" }
vcp-memory = { path = "../vcp-memory" }
vcp-context = { path = "../vcp-context" }
vcp-models = { path = "../vcp-models" }
vcp-extensions = { path = "../vcp-extensions" }
vcp-repository = { path = "../vcp-repository" }
vcp-policy = { path = "../vcp-policy" }
vcp-tools = { path = "../vcp-tools" }
codex-apply-patch = { workspace = true }
codex-features = { workspace = true }
munarium-core = { path = "../../third_party/munarium/server/src/munarium-core" }
codex-core = { workspace = true }
codex-extension-api = { workspace = true }
codex-protocol = { workspace = true }
codex-utils-pty = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = ["tokio"] }
rustls = { workspace = true }
socket2 = { workspace = true }
tokio-rustls = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "io-util", "fs", "net"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
rcgen = { workspace = true }
wiremock = { workspace = true }
codex-login = { workspace = true }
core_test_support = { path = "../../third_party/codex/codex-rs/core/tests/common" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
