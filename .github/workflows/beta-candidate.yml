# SPDX-License-Identifier: Apache-2.0
name: Internal beta candidate
on:
  workflow_dispatch:
    inputs:
      reviewed_commit:
        description: 'Exact reviewed main commit (40 lowercase hex), with successful Delivery checks'
        required: true
        type: string
      stop_after:
        description: 'Bounded checkpoint; later work remains explicitly unrun'
        required: true
        default: portable-contracts
        type: choice
        options:
          - portable-contracts
          - production-build
          - pair
          - installed-editor
permissions:
  contents: read
  actions: read
concurrency:
  group: internal-beta-candidate
  cancel-in-progress: false
jobs:
  candidate:
    if: github.ref == 'refs/heads/main'
    environment: native-signing
    permissions:
      contents: read
      actions: read
      id-token: write
    runs-on:
      group: wingroup
      labels: vcpwin
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    env:
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      # Owner-provisioned Windows 2025 runner: 16 cores, 64 GB RAM, 600 GB SSD.
      CARGO_BUILD_JOBS: '16'
      # Dedicated homes prevent inherited configuration or credentials from
      # entering the download caches. Compiled/extracted sources stay uncached.
      CARGO_HOME: ${{ runner.temp }}/vcp-candidate-cargo
      npm_config_cache: ${{ runner.temp }}/vcp-candidate-npm
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      STOP_AFTER: ${{ inputs.stop_after }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed main selection and successful delivery checks
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          if ($env:REVIEWED_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:REVIEWED_COMMIT -cne $env:GITHUB_SHA) { throw 'Reviewed selection must be this exact main workflow commit' }
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:REVIEWED_COMMIT&status=success&per_page=100"
          $runs = Invoke-RestMethod -Uri $uri -Headers @{Authorization="Bearer $env:GH_READ_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $passed = @($runs.workflow_runs | Where-Object { $_.head_sha -ceq $env:REVIEWED_COMMIT -and $_.head_branch -ceq 'main' -and $_.event -ceq 'push' -and $_.conclusion -ceq 'success' })
          if ($passed.Count -eq 0) { throw 'No successful main Delivery check run exists for the exact selected commit' }
          New-Item -ItemType Directory -Path artifacts/beta-gate -Force | Out-Null
          @{reviewed_commit=$env:REVIEWED_COMMIT;workflow='ci.yml';successful_run=$passed[0].html_url;run_id=$passed[0].id} | ConvertTo-Json | Set-Content artifacts/beta-gate/delivery.json -Encoding utf8NoBOM
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
      - name: Cache locked npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.npm_config_cache }}/_cacache/
          key: beta-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/candidate-tools.json') }}-${{ hashFiles('src/tests/package-lock.json', 'src/packages/sdk-ts/package-lock.json', 'src/packages/vscode/package-lock.json') }}
          # Product-version bumps change locks while dependency archives remain
          # reusable. The fallback stays inside the same platform and tool pins.
          restore-keys: beta-npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/candidate-tools.json') }}-
      - name: Cache locked Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index/
            ${{ env.CARGO_HOME }}/registry/cache/
            ${{ env.CARGO_HOME }}/git/db/
          key: beta-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/candidate-tools.json', 'src/third_party/codex/codex-rs/rust-toolchain.toml') }}-${{ hashFiles('src/third_party/codex/codex-rs/Cargo.lock') }}
          restore-keys: beta-cargo-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('release/candidate-tools.json', 'src/third_party/codex/codex-rs/rust-toolchain.toml') }}-
      - name: Provision locked packaging and contract tools
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          foreach ($package in @('src/tests','src/packages/sdk-ts','src/packages/vscode')) {
            npm.cmd ci --prefix $package --ignore-scripts --no-audit --no-fund --prefer-offline
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # Selected stage limits total at most 325 minutes. Setup consumes part of
      # the remaining job budget; always() evidence retention remains best effort.
      - name: Validate exact source and select physical tool paths
        timeout-minutes: 5
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage source-gate -StopAfter $env:STOP_AFTER
      - name: Provision pinned compiler, editor and dependency inputs
        timeout-minutes: 15
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage provision -StopAfter $env:STOP_AFTER
      - name: Run portable contracts and editor archive checks
        timeout-minutes: 20
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage portable-contracts -StopAfter $env:STOP_AFTER
      - name: Build and verify production engine and launcher
        if: success() && inputs.stop_after != 'portable-contracts'
        timeout-minutes: 100
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage production-build -StopAfter $env:STOP_AFTER
      - name: Provision pinned Authenticode tools
        if: success() && contains(fromJSON('["pair","installed-editor"]'), inputs.stop_after)
        timeout-minutes: 5
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: |
          $manifest = ./scripts/release/signing-provision.ps1 -OutputRoot artifacts/signing-tools
          "VCP_SIGNING_TOOLS_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Authenticate narrowly scoped signing identity
        id: signing-login
        if: success() && contains(fromJSON('["pair","installed-editor"]'), inputs.stop_after)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_SIGNING_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_SIGNING_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SIGNING_SUBSCRIPTION_ID }}
      - name: Assemble and verify native payload and notices
        if: success() && contains(fromJSON('["pair","installed-editor"]'), inputs.stop_after)
        timeout-minutes: 10
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage native-package -StopAfter $env:STOP_AFTER
      - name: Build registered Windows setup
        if: success() && contains(fromJSON('["pair","installed-editor"]'), inputs.stop_after)
        timeout-minutes: 10
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage setup-package -StopAfter $env:STOP_AFTER
      - name: Clear signing login after packaging
        if: always() && steps.signing-login.outcome == 'success'
        run: az logout
      - name: Build and verify matching VSIX
        if: success() && contains(fromJSON('["pair","installed-editor"]'), inputs.stop_after)
        timeout-minutes: 10
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage vsix-package -StopAfter $env:STOP_AFTER
      - name: Verify final artifact pair and release production target space
        if: success() && contains(fromJSON('["pair","installed-editor"]'), inputs.stop_after)
        timeout-minutes: 5
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage pair -StopAfter $env:STOP_AFTER
      - name: Compile and run native qualification boundaries
        if: success() && inputs.stop_after == 'installed-editor'
        timeout-minutes: 100
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage native-boundaries -StopAfter $env:STOP_AFTER
      - name: Qualify installed native launcher and console cancellation
        if: success() && inputs.stop_after == 'installed-editor'
        timeout-minutes: 25
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage installed-native -StopAfter $env:STOP_AFTER
      - name: Qualify installed editor lifecycle on both stores
        if: success() && inputs.stop_after == 'installed-editor'
        timeout-minutes: 25
        run: ./scripts/release/candidate.ps1 -ReviewedCommit $env:REVIEWED_COMMIT -OutputRoot artifacts/beta-candidate -Jobs $env:CARGO_BUILD_JOBS -Stage installed-editor -StopAfter $env:STOP_AFTER
      - name: Collect sanitized evidence including failures and unrun cases
        if: always()
        run: |
          $record = 'artifacts/beta-candidate/run.json'
          if (-not (Test-Path -LiteralPath $record)) {
            New-Item -ItemType Directory -Path artifacts/beta-failure -Force | Out-Null
            $record = 'artifacts/beta-failure/run.json'
            @{schema='vcp-candidate-run/1';status='fail';reviewed_commit=$env:GITHUB_SHA;environment=@{os=[Runtime.InteropServices.RuntimeInformation]::OSDescription;node=(& node --version);runner_image=$env:ImageOS;runner_image_version=$env:ImageVersion};stages=@();receipts=@{}} | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $record -Encoding utf8NoBOM
          }
          node scripts/release/evidence.cjs $record artifacts/beta-evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain complete candidate packet for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: internal-beta-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/beta-evidence/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
