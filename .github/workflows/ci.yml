# SPDX-License-Identifier: Apache-2.0
name: Delivery checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: delivery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  delivery:
    name: Repository and harness
    runs-on: ubuntu-8core
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
      - name: Install pinned development tools
        run: npm ci --prefix src/tests --ignore-scripts --no-audit --no-fund
      - name: Run deterministic delivery checks
        shell: pwsh
        run: ./scripts/test.ps1 -Suite fast
      - name: Verify imported Git modes and bytes
        run: node scripts/upstream/reconstruct.cjs verify-index --component codex
      - name: Verify imported Munarium Git modes and bytes
        run: node scripts/upstream/reconstruct.cjs verify-index --component munarium
      - name: Retain evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: delivery-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/tests/
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Native Windows qualification
    runs-on: win8core
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      # Process-scoped configuration also covers checkout's first Git operation.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.10.0'
      - name: Install pinned development tools
        run: |
          npm ci --prefix src/tests --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.98.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run deterministic delivery checks on Windows
        run: ./scripts/test.ps1 -Suite fast
      - name: Verify imported Git modes and bytes
        run: node scripts/upstream/reconstruct.cjs verify-index --component codex
      - name: Verify imported Munarium Git modes and bytes
        run: node scripts/upstream/reconstruct.cjs verify-index --component munarium
      - name: Independently reconstruct the immutable source selection
        run: |
          $origins = @{ codex = 'https://github.com/openai/codex.git'; munarium = 'https://github.com/iokaio/munarium.git' }
          foreach ($component in @('codex', 'munarium')) {
            $selection = Get-Content "src/third_party/components/$component-selection.json" -Raw | ConvertFrom-Json
            git init "artifacts/upstream/$component-candidate"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C "artifacts/upstream/$component-candidate" fetch --depth=1 $origins[$component] $selection.commit
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node scripts/upstream/reconstruct.cjs reconstruct --component $component --source "artifacts/upstream/$component-candidate" --output "artifacts/reconstructed/$component" --record "artifacts/$component-reconstructed.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            node -e "const fs = require('node:fs'), id = process.argv[1]; require('node:assert/strict').deepEqual(JSON.parse(fs.readFileSync('artifacts/' + id + '-reconstructed.json')), JSON.parse(fs.readFileSync('src/third_party/components/' + id + '-files.json'))); console.log(id + ' reconstruction matches committed inventory');" $component
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Acquire pinned Gemini qualification inputs
        run: |
          $pin = node -e "const fs = require('node:fs'), toml = require('./src/tests/node_modules/@iarna/toml'); console.log(toml.parse(fs.readFileSync('src/third_party/upstreams.toml', 'utf8')).upstream.find(p => p.id === 'gemini-cli').commit);"
          if ($LASTEXITCODE -ne 0 -or $pin -notmatch '^[a-f0-9]{40}$') { throw 'Invalid Gemini pin' }
          git init artifacts/upstream/gemini-candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C artifacts/upstream/gemini-candidate fetch --depth=1 https://github.com/google-gemini/gemini-cli.git $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C artifacts/upstream/gemini-candidate checkout --detach $pin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location artifacts/upstream/gemini-candidate
          try {
            npm ci --ignore-scripts --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Qualify pinned Gemini boundaries on Windows
        run: node scripts/upstream/test-gemini.cjs --source artifacts/upstream/gemini-candidate --output-root artifacts/gemini-qualification --prepare
      - name: Qualify local CPU embeddings and corpus retrieval
        run: |
          $modelRoot = Join-Path $env:RUNNER_TEMP ('vcp-minilm-' + [guid]::NewGuid().ToString())
          node scripts/upstream/model-assets.cjs acquire --root $modelRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-embeddings.ps1 -AssetsRoot $modelRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test-local-memory.ps1 -AssetsRoot $modelRoot -TargetRoot artifacts/embedding-target
      - name: Build committed native CLI
        run: ./scripts/build.ps1
      - name: Test native patch and policy boundaries
        run: ./scripts/build.ps1 -Mode BoundaryTests
      - name: Test committed local-memory libraries and dependency boundary
        run: ./scripts/build.ps1 -Component Munarium -Mode BoundaryTests -TargetRoot artifacts/munarium-target
      - name: Trace native CLI against the local scripted provider
        run: node scripts/upstream/trace-cli.cjs --binary artifacts/codex-target/x86_64-pc-windows-msvc/debug/codex.exe
      - name: Retain Windows evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/tests/
            artifacts/build/
            artifacts/cli-trace/
            artifacts/codex-reconstructed.json
            artifacts/munarium-reconstructed.json
            artifacts/gemini-qualification/
            artifacts/embeddings/
            artifacts/local-memory/
            !artifacts/gemini-qualification/**/synthetic-home/**
            !artifacts/local-memory/**/profile/**
          if-no-files-found: error
          retention-days: 14
